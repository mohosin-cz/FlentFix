<style>
/* ───────────────────────────────────────────────────────────────────────────
   Tokens — copied from src/styles/theme.css so this file stands alone.

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   1 · THE RECORD SET
   Shaped from the live table (318 rows, 162 PIDs) so every number this page
   shows — the gaps, the five spellings of one plan, the price contradictions —
   is the real shape of the data, not a flattering invention.
   ═══════════════════════════════════════════════════════════════════════════ */
const TODAY = new Date('2026-10-15T00:00:00');
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const D = s => s ? new Date(s+'T00:00:00') : null;
const addM = (d,m) => { const x = new Date(d); const day = x.getDate(); x.setMonth(x.getMonth()+m); if (x.getDate() < day) x.setDate(0); return x; };
const daysBetween = (a,b) => Math.round((b-a)/864e5);

// deterministic PRNG — same page every reload, so a number you quote stays true
let _s = 20260415;
const rnd = () => (_s = (_s*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
const pick = a => a[Math.floor(rnd()*a.length)];
const chance = p => rnd() < p;

const CYCLE_M = { 'Monthly':1, 'Bi-monthly':2, 'Quarterly':3, 'Half-yearly':6, 'Yearly':12 };
const TYPE = {
  wifi:            { label:'WiFi',            color:'var(--c1)', ico:'◉' },
  water_purifier:  { label:'Water purifier',  color:'var(--c3)', ico:'◍' },
  other:           { label:'Other',           color:'var(--c4)', ico:'◌' },
};
const PALETTE = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];

// ── properties ──────────────────────────────────────────────────────────────
const LOC = ['Koramangala','HSR Layout','Bellandur','Marathahalli','Whitefield','Indiranagar','BTM Layout','Sarjapur Road','Electronic City','Hebbal','Kundalahalli','Hoodi','Jayanagar','Kadugodi','Yelahanka'];
const N1 = ['Sai','Sri','Lakshmi','Prestige','Nakshatra','Gokul','Amrutha','Vaishnavi','Divya','Mahalakshmi','Shanthi','Royal','Green','Silver','Sunrise','Anugraha','Pavithra','Harmony','Lotus','Mangala'];
const N2 = ['Residency','Nivas','Enclave','Comforts','Nest','Heights','Apartments','Villa','Mansion','Habitat','Court','Homes'];
const PROPS = [];
for (let i = 0; i < 162; i++) {
  const pid = String(101 + i + (i > 80 ? 14 : 0));              // sparse, like real PIDs
  PROPS.push({ pid, name:`${pick(N1)} ${pick(N2)}`, loc:pick(LOC), units: 3 + Math.floor(rnd()*9) });
}
const PROP = Object.fromEntries(PROPS.map(p => [p.pid, p]));

// ── the real month histogram of start dates ─────────────────────────────────
const MONTHS = { '2024-10':1,'2025-03':9,'2025-04':11,'2025-05':10,'2025-06':3,'2025-07':10,'2025-09':4,'2025-10':11,'2025-11':10,'2025-12':16,'2026-01':22,'2026-02':19,'2026-03':18,'2026-04':30,'2026-05':39,'2026-06':48,'2026-07':37,'2026-08':4,'2026-09':5 };
const MONTH_POOL = [];
for (const [m,n] of Object.entries(MONTHS)) for (let i = 0; i < n; i++) MONTH_POOL.push(m);
const drawStart = () => { const m = pick(MONTH_POOL); return `${m}-${String(1 + Math.floor(rnd()*27)).padStart(2,'0')}`; };

// ── what we actually have, provider by provider ─────────────────────────────
// plans: the RAW spellings as typed by whoever entered the record. The five
// variants of ACT's 200-mesh plan are not a mistake in this seed — they are in
// the table right now, and they are the reason a "same plan, same price" check
// cannot be done by grouping on the text.
const SPECS = [
  { t:'water_purifier', p:'DrinkPrime',      plans:[null],                                                              cycle:'Yearly',      amts:[5088],                     n:107, inv:0,    acc:.28, mode:'Company' },
  { t:'wifi',           p:'ACT',             plans:['200 Mbps mesh','200 mbps mesh','200 Mbps Mesh','200mbps','200 mbps'], cycle:'Half-yearly', amts:[7073,7073,7073,7073,7257,0], n:78, inv:.80, acc:.95, mode:'Company' },
  { t:'wifi',           p:'ACT',             plans:['300 mbps'],                                                        cycle:'Monthly',     amts:[1769],                     n:59,  inv:.51,  acc:1,   mode:'Company' },
  { t:'wifi',           p:'ACT',             plans:['400 mbps','400mbps'],                                              cycle:'Half-yearly', amts:[8850,8850,9350],           n:8,   inv:.13,  acc:1,   mode:'Company' },
  { t:'wifi',           p:'Airtel',          plans:['100 mbps','100 Mbps'],                                             cycle:'Bi-monthly',  amts:[1500,1500,1500,2500],      n:9,   inv:0,    acc:1,   mode:'Company' },
  { t:'water_purifier', p:'AquaGuard-LL',    plans:[null],                                                              cycle:null,          amts:[0],                        n:7,   inv:0,    acc:0,   mode:'Landlord' },
  { t:'water_purifier', p:'DrinkPrime',      plans:[null,'250L/M','Unlimited'],                                         cycle:'Monthly',     amts:[885],                      n:6,   inv:0,    acc:.6,  mode:'Company' },
  { t:'wifi',           p:'Airtel',          plans:['100 mbps','100mbps','100 mbps + mesh','300 mbps'],                  cycle:'Quarterly',   amts:[2828,2828,3828],           n:6,   inv:.40,  acc:1,   mode:'Company' },
  { t:'water_purifier', p:'DrinkPrime',      plans:['Unlimited','250L/M'],                                              cycle:'Yearly',      amts:[6289,5088],                n:5,   inv:0,    acc:.3,  mode:'Company' },
  { t:'wifi',           p:'Tata Play Fiber', plans:['100 mbps','200 mbps'],                                             cycle:'Yearly',      amts:[9912,11800],               n:3,   inv:1,    acc:1,   mode:'Company' },
  { t:'wifi',           p:'ACT',             plans:[null],                                                              cycle:'Monthly',     amts:[1769,5088,2875],           n:4,   inv:0,    acc:.7,  mode:'Company' },
  { t:'wifi',           p:'JioFiber',        plans:['150 mbps'],                                                        cycle:'Quarterly',   amts:[2497],                     n:3,   inv:.6,   acc:1,   mode:'Company' },
  { t:'other',          p:'BESCOM',          plans:['Common area meter'],                                               cycle:'Monthly',     amts:[1240,980,1610],            n:3,   inv:0,    acc:.6,  mode:'Landlord' },
  { t:'other',          p:'BWSSB',           plans:['Water connection'],                                                cycle:'Monthly',     amts:[820,640],                  n:2,   inv:0,    acc:.5,  mode:'Landlord' },
  { t:'other',          p:'Piped gas',       plans:['Domestic PNG'],                                                    cycle:'Bi-monthly',  amts:[1150],                     n:2,   inv:0,    acc:1,   mode:'Landlord' },
  { t:'wifi',           p:'Hathway',         plans:['100 mbps'],                                                        cycle:'Half-yearly', amts:[5400],                     n:1,   inv:0,    acc:1,   mode:'Company' },
];

// canonical plan — what the record MEANS, independent of how it was typed.
// Everything that compares like with like goes through this; the raw string is
// kept and shown, because fixing the typing is itself a job this page surfaces.
function canonPlan(type, provider, plan) {
  if (!plan) return null;
  let s = plan.toLowerCase().replace(/\s+/g,' ').trim();
  s = s.replace(/\bmbps\b/g,'mbps').replace(/(\d)\s*mbps/,'$1 mbps');
  if (/\+\s*mesh/.test(s)) s = s.replace(/\+\s*mesh/,'mesh');
  s = s.replace(/\s+mesh/,' mesh').trim();
  return s.replace(/\b\w/g, c => c.toUpperCase()).replace(/Mbps/,'Mbps');
}

const ACTORS = ['Mohosin','Prakash K','Ayesha R','Rahul D','ops@flent (import)'];
const SOURCES = ['Onboarding form','Bulk import 2025','Manual entry','Vendor invoice'];

// ── build the 318 ──────────────────────────────────────────────────────────
let _id = 0;
const pool = [];
for (const s of SPECS) for (let i = 0; i < s.n; i++) {
  const plan = s.plans[i % s.plans.length];
  const amt = s.amts[i % s.amts.length];
  pool.push({ t:s.t, provider:s.p, plan, cycle:s.cycle, amount:amt,
              hasInv:chance(s.inv), hasAcc:chance(s.acc), mode:s.mode });
}

// pid quotas straight from the live shape: 17 pids with 1, 135 with 2, 9 with 3, 1 with 4
const quota = [];
PROPS.forEach((p,i) => quota.push(i < 17 ? 1 : i < 152 ? 2 : i < 161 ? 3 : 4));
// Assign records to properties without inventing duplicates: a property only
// ends up with two of the same type-and-provider when the quotas leave no
// alternative. The handful that survive are a real finding, not a seeding
// artefact — which matters, because the duplicate check is one of the ones
// this page asks you to believe.
const cap = {}; PROPS.forEach((p,i) => cap[p.pid] = quota[i]);
const pids = PROPS.map(p => p.pid);
const taken = {}, assign = new Array(pool.length);
const order = pool.map((_,i) => i);
for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd()*(i+1)); [order[i],order[j]] = [order[j],order[i]]; }
for (const i of order) {
  const r = pool[i], key = r.t + '|' + r.provider;
  let clean = null, any = null;
  for (let tries = 0; tries < 220 && !clean; tries++) {
    const pid = pids[Math.floor(rnd()*pids.length)];
    if (cap[pid] <= 0) continue;
    if (any === null) any = pid;
    if (!taken[pid] || !taken[pid].has(key)) clean = pid;
  }
  const pid = clean || any || pids.find(x => cap[x] > 0);
  cap[pid]--; (taken[pid] = taken[pid] || new Set()).add(key);
  assign[i] = pid;
}

const RECORDS = pool.map((r,i) => {
  const pid = assign[i];
  const start = drawStart();
  const cm = CYCLE_M[r.cycle] || null;
  let lastRech = null;
  if (cm && chance(.62)) {
    const s = D(start); let d = new Date(s), k = 0;
    while (addM(d, cm) <= TODAY && k < 40) { d = addM(d, cm); k++; }
    lastRech = iso(d);
  }
  const createdAt = iso(addM(D(start), 0));
  return {
    id: 'u' + (++_id).toString().padStart(3,'0'),
    pid, type:r.t, provider:r.provider,
    plan:r.plan, planCanon:canonPlan(r.t, r.provider, r.plan),
    account: r.hasAcc ? (r.t === 'wifi' ? '10' + Math.floor(rnd()*9e8 + 1e8) : 'DP-' + Math.floor(rnd()*9e5 + 1e5)) : null,
    ssid: r.t === 'wifi' && chance(.72) ? `Flent_${pid}${chance(.3) ? '_5G' : ''}` : null,
    password: r.t === 'wifi' && chance(.66) ? 'flent@' + Math.floor(rnd()*9000 + 1000) : null,
    lockbox: chance(.22) ? String(Math.floor(rnd()*9000 + 1000)) : null,
    start, amount:r.amount, cycle:r.cycle,
    addedCost: chance(.14) ? [500,1000,1500,2000][Math.floor(rnd()*4)] : 0,
    status:'active',
    invoice: r.hasInv ? `https://drive.flent.in/inv/${pid}-${_id}.pdf` : null,
    payMode: r.mode, source: pick(SOURCES),
    lastRech, notes: chance(.18) ? pick(['Router in the lobby cupboard.','Landlord pays, we reimburse.','Shifted from the old provider.','Tenant asked for an upgrade.','Installed during handover.']) : null,
    createdBy: pick(ACTORS), createdAt, updatedAt: createdAt,
    supersededBy: null, supersedes: null,
  };
});

// ── record chains: the predecessor rows ─────────────────────────────────────
// 15 of the 318 are 'superseded'. They are not clutter — they are the only
// record that a property used to be on a different plan at a different price,
// which is exactly what a record-keeping system is for.
const byPT = {};
RECORDS.forEach(r => { const k = r.pid + '|' + r.type; (byPT[k] = byPT[k] || []).push(r); });
let chained = 0;
for (const r of RECORDS) {
  if (chained >= 15) break;
  if (r.type !== 'wifi' || r.supersedes) continue;
  if (!chance(.14)) continue;
  const oldStart = iso(addM(D(r.start), -(7 + Math.floor(rnd()*14))));
  const oldPlan  = pick(['100 mbps','150 mbps','200 mbps']);
  const pred = { ...r,
    id:'u' + (++_id).toString().padStart(3,'0'),
    plan:oldPlan, planCanon:canonPlan('wifi', r.provider, oldPlan),
    provider: chance(.4) ? pick(['Airtel','Hathway','JioFiber']) : r.provider,
    amount: Math.round(r.amount * (.6 + rnd()*.25) / 10) * 10,
    start:oldStart, createdAt:oldStart, updatedAt:r.start,
    status:'superseded', supersededBy:r.id, supersedes:null,
    invoice: chance(.3) ? r.invoice : null, lastRech:null,
    notes:'Replaced — see the successor record.',
  };
  r.supersedes = pred.id;
  RECORDS.push(pred);
  chained++;
}
// 11 'unknown', 1 'cancelled' — same as live
const act = RECORDS.filter(r => r.status === 'active');
for (let i = 0; i < 11; i++) act[Math.floor(rnd()*act.length)].status = 'unknown';
act[Math.floor(rnd()*act.length)].status = 'cancelled';

// ── an audit trail per record ───────────────────────────────────────────────
const FIELD_LABEL = { amount:'Billing amount', plan:'Plan', cycle:'Billing cycle', provider:'Provider', account:'Account number', invoice:'Invoice link', status:'Status', ssid:'SSID', password:'WiFi password' };
RECORDS.forEach(r => {
  const h = [{ at:r.createdAt, who:r.createdBy, kind:'created', text:`Record created from ${r.source.toLowerCase()}` }];
  const edits = Math.floor(rnd()*3);
  for (let i = 0; i < edits; i++) {
    const f = pick(['amount','plan','account','invoice','cycle']);
    const at = iso(addM(D(r.createdAt), 1 + Math.floor(rnd()*8)));
    if (at > iso(TODAY)) continue;
    let from = '—', to = '—';
    if (f === 'amount') { from = '₹' + Math.round(r.amount*(.85+rnd()*.1)); to = '₹' + r.amount; }
    else if (f === 'plan') { from = r.plan ? pick(['100 mbps','200mbps','']) || '—' : '—'; to = r.plan || '—'; }
    else if (f === 'account') { from = 'blank'; to = r.account ? r.account.slice(0,4) + '…' : '—'; }
    else if (f === 'invoice') { from = 'blank'; to = r.invoice ? 'link added' : '—'; }
    else { from = pick(['Monthly','Quarterly']); to = r.cycle || '—'; }
    h.push({ at, who:pick(ACTORS), kind:'changed', field:f, from, to });
    if (at > r.updatedAt) r.updatedAt = at;
  }
  if (r.lastRech) h.push({ at:r.lastRech, who:pick(ACTORS), kind:'recharge', text:`Recharged — ₹${r.amount.toLocaleString('en-IN')} for the ${(r.cycle||'').toLowerCase()} period` });
  if (r.status === 'superseded') h.push({ at:r.updatedAt, who:pick(ACTORS), kind:'changed', field:'status', from:'active', to:'superseded' });
  r.history = h.sort((a,b) => a.at < b.at ? 1 : -1);
});

/* ═══ derived ═══════════════════════════════════════════════════════════════ */
const monthlyOf = r => { const m = CYCLE_M[r.cycle]; return (m && r.amount) ? r.amount / m : 0; };
const annualOf  = r => monthlyOf(r) * 12;
const periodOf  = (d, g) => { if (!d) return null; const [y,m] = d.split('-'); return g === 'year' ? y : g === 'quarter' ? `${y}-Q${Math.ceil(+m/3)}` : `${y}-${m}`; };
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const inrK = n => n >= 1e7 ? '₹' + (n/1e7).toFixed(2) + 'Cr' : n >= 1e5 ? '₹' + (n/1e5).toFixed(2) + 'L' : n >= 1000 ? '₹' + (n/1000).toFixed(1) + 'k' : inr(n);

// the six fields a record needs before anyone can act on it
const CORE = [
  { k:'provider', label:'Provider',       has:r => !!r.provider },
  { k:'plan',     label:'Plan',           has:r => !!r.plan },
  { k:'account',  label:'Account number', has:r => !!r.account },
  { k:'start',    label:'Start date',     has:r => !!r.start },
  { k:'cycle',    label:'Billing cycle',  has:r => !!r.cycle },
  { k:'amount',   label:'Billing amount', has:r => !!r.amount },
  { k:'invoice',  label:'Invoice link',   has:r => !!r.invoice },
];
const completeness = r => CORE.filter(c => c.has(r)).length;
const missingOf = r => CORE.filter(c => !c.has(r));
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   2 · DIMENSIONS, MEASURES, AND THE CHECKS
   ═══════════════════════════════════════════════════════════════════════════ */
const DIMS = {
  type:      { label:'Utility type',       of:r => TYPE[r.type].label },
  provider:  { label:'Provider',           of:r => r.provider },
  planCanon: { label:'Plan · normalised',  of:r => r.planCanon || '— not recorded' },
  plan:      { label:'Plan · as typed',    of:r => r.plan || '— not recorded' },
  cycle:     { label:'Billing cycle',      of:r => r.cycle || '— not recorded' },
  status:    { label:'Record status',      of:r => r.status[0].toUpperCase() + r.status.slice(1) },
  payMode:   { label:'Who pays',           of:r => r.payMode },
  source:    { label:'How it was recorded',of:r => r.source },
  loc:       { label:'Locality',           of:r => PROP[r.pid] ? PROP[r.pid].loc : '—' },
  pid:       { label:'Property',           of:r => r.pid },
  month:     { label:'Installed · month',  of:r => periodOf(r.start,'month')   || '— no date' },
  quarter:   { label:'Installed · quarter',of:r => periodOf(r.start,'quarter') || '— no date' },
  year:      { label:'Installed · year',   of:r => periodOf(r.start,'year')    || '— no date' },
  complete:  { label:'Completeness',       of:r => { const c = completeness(r); return c === CORE.length ? 'Complete' : c >= 5 ? 'Nearly — 1–2 gaps' : c >= 3 ? 'Partial — 3–4 gaps' : 'Sparse — 5+ gaps'; } },
};
const sum = (rows, f) => rows.reduce((a,r) => a + f(r), 0);
const MEAS = {
  count:   { label:'Records',           of:rows => rows.length,                        fmt:n => n.toLocaleString('en-IN'), unit:'records' },
  props:   { label:'Properties covered',of:rows => new Set(rows.map(r => r.pid)).size,  fmt:n => n.toLocaleString('en-IN'), unit:'properties' },
  monthly: { label:'Monthly run-rate',  of:rows => sum(rows, monthlyOf),                fmt:inrK, unit:'per month' },
  annual:  { label:'Annualised cost',   of:rows => sum(rows, annualOf),                 fmt:inrK, unit:'per year' },
  billed:  { label:'Billed per cycle',  of:rows => sum(rows, r => r.amount || 0),       fmt:inrK, unit:'per cycle' },
  ticket:  { label:'Average bill',      of:rows => rows.length ? sum(rows, r => r.amount || 0)/rows.length : 0, fmt:inr, unit:'average' },
};

/* ── the checks ─────────────────────────────────────────────────────────────
   Two families, deliberately separated.
   GAPS are things a record does not say. They are tedious but obvious.
   CONTRADICTIONS are things the records say that cannot all be true at once —
   one plan under five spellings, one price under three values. Those are the
   ones nobody finds by scrolling, and they are why this page exists.          */
function buildChecks(all) {
  const out = [];
  const gap = (id, label, why, test, sev) => { const rows = all.filter(test); if (rows.length) out.push({ id, fam:'gap', label, why, sev, rows }); };
  gap('g-inv',   'No invoice link',    'There is nothing to show a landlord or an auditor for this connection.', r => !r.invoice, 'warn');
  gap('g-plan',  'No plan recorded',   'The speed or litres this connection buys is not written down anywhere.', r => !r.plan, 'warn');
  gap('g-acc',   'No account number',  'Nobody can call the provider about this connection without hunting for it.', r => !r.account, 'warn');
  gap('g-amt',   'No billing amount',  'This connection is invisible to every cost figure on this page.', r => !r.amount, 'bad');
  gap('g-cyc',   'No billing cycle',   'Without a cycle the amount cannot be turned into a monthly cost.', r => !r.cycle, 'bad');
  gap('g-start', 'No start date',      'The record cannot be placed in time — it falls out of every trend.', r => !r.start, 'bad');

  // one plan, several spellings
  const spell = {};
  all.forEach(r => { if (!r.planCanon) return; const k = `${r.type}|${r.provider}|${r.planCanon}`; (spell[k] = spell[k] || []).push(r); });
  const spellRows = [], spellEv = [];
  Object.entries(spell).forEach(([k, rows]) => {
    const raw = {}; rows.forEach(r => raw[r.plan] = (raw[r.plan]||0) + 1);
    if (Object.keys(raw).length > 1) {
      spellRows.push(...rows);
      spellEv.push({ head:`${k.split('|')[1]} · ${k.split('|')[2]}`, parts:Object.entries(raw).sort((a,b) => b[1]-a[1]) });
    }
  });
  if (spellRows.length) out.push({ id:'c-spell', fam:'con', label:'One plan, several spellings', sev:'warn', rows:spellRows, ev:spellEv,
    why:'Grouping on the plan text splits one plan into several. Every per-plan price comparison is wrong until these are spelled the same way.' });

  // one plan + cycle, several prices
  const price = {};
  all.filter(r => r.status === 'active' && r.amount && r.cycle && r.planCanon).forEach(r => {
    const k = `${r.provider}|${r.planCanon}|${r.cycle}`; (price[k] = price[k] || []).push(r);
  });
  const priceRows = [], priceEv = [];
  Object.entries(price).forEach(([k, rows]) => {
    const amts = {}; rows.forEach(r => amts[r.amount] = (amts[r.amount]||0) + 1);
    const vals = Object.keys(amts).map(Number).sort((a,b) => a-b);
    if (vals.length > 1) {
      priceRows.push(...rows);
      const [p,pl,c] = k.split('|');
      priceEv.push({ head:`${p} · ${pl} · ${c.toLowerCase()}`, lo:vals[0], hi:vals[vals.length-1],
                     parts:Object.entries(amts).sort((a,b) => b[1]-a[1]).map(([a,n]) => [inr(+a), n]),
                     spread:vals[vals.length-1] - vals[0], n:rows.length });
    }
  });
  priceEv.sort((a,b) => b.spread*b.n - a.spread*a.n);
  if (priceRows.length) out.push({ id:'c-price', fam:'con', label:'Same plan, different price', sev:'bad', rows:priceRows, ev:priceEv,
    why:'Identical plan, identical cycle, different amount on the record. Either somebody is paying more than they should, or one of these numbers is simply wrong.' });

  // two live records for the same thing
  const dupe = {}; all.filter(r => r.status === 'active').forEach(r => { const k = `${r.pid}|${r.type}|${r.provider}`; (dupe[k] = dupe[k] || []).push(r); });
  const dupeRows = Object.values(dupe).filter(v => v.length > 1).flat();
  if (dupeRows.length) out.push({ id:'c-dupe', fam:'con', label:'Two live records for one connection', sev:'bad', rows:dupeRows,
    why:'The same property has more than one active record with the same provider and type. One of them is probably the old connection that was never marked superseded — which means the cost is being counted twice.' });

  const unk = all.filter(r => r.status === 'unknown');
  if (unk.length) out.push({ id:'c-unk', fam:'con', label:'Status never set', sev:'warn', rows:unk,
    why:'The record does not say whether this connection is live. It is counted in the costs on this page because nothing says it should not be.' });

  const stale = all.filter(r => r.status === 'active' && daysBetween(D(r.updatedAt), TODAY) > 270);
  if (stale.length) out.push({ id:'c-stale', fam:'gap', label:'Untouched for over 9 months', sev:'warn', rows:stale,
    why:'Nobody has looked at this record in three quarters. It may be perfectly correct — but nothing here confirms it still describes reality.' });

  return out;
}
const CHECKS = buildChecks(RECORDS);

// property-level coverage: which properties have what
const COVERAGE = PROPS.map(p => {
  const rows = RECORDS.filter(r => r.pid === p.pid && r.status === 'active');
  return { ...p, rows, wifi:rows.some(r => r.type === 'wifi'), water:rows.some(r => r.type === 'water_purifier'),
           monthly:sum(rows, monthlyOf), n:rows.length };
});

/* ═══════════════════════════════════════════════════════════════════════════
   3 · STATE
   ═══════════════════════════════════════════════════════════════════════════ */
const S = {
  // Pulse is a dark-first product, but a viewer whose system asks for light
  // should not be handed dark and made to find the toggle.
  tab:'explore', theme:(matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'), q:'',
  filters:[],                                   // [{dim, val}] — composable, shown as chips
  idSet:null, idSetLabel:'',                    // a check's result, carried into Records
  group:'provider', group2:'none', measure:'monthly', grain:'month', view:'bars',
  sort:{ col:'pid', dir:1 }, open:null, expand:{}, check:CHECKS[0] ? 'c-price' : null,
  cmp:'bench', incSuperseded:false,
};
const DEFAULT_COLS = ['pid','type','provider','plan','cycle','amount','monthly','start','status','complete'];
S.cols = [...DEFAULT_COLS];

function filtered() {
  let rows = RECORDS;
  if (!S.incSuperseded) rows = rows.filter(r => r.status !== 'superseded');
  if (S.idSet) rows = rows.filter(r => S.idSet.has(r.id));
  for (const f of S.filters) rows = rows.filter(r => DIMS[f.dim].of(r) === f.val);
  if (S.q.trim()) {
    const q = S.q.trim().toLowerCase();
    rows = rows.filter(r => [r.pid, PROP[r.pid] && PROP[r.pid].name, PROP[r.pid] && PROP[r.pid].loc, r.provider, r.plan, r.account, r.ssid, r.notes, TYPE[r.type].label]
      .filter(Boolean).some(v => String(v).toLowerCase().includes(q)));
  }
  return rows;
}
const addFilter = (dim, val) => { if (!S.filters.some(f => f.dim === dim && f.val === val)) S.filters.push({ dim, val }); render(); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* ── tooltip ───────────────────────────────────────────────────────────────── */
let tipEl = null;
function initTip() {
  tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.style.display = 'none';
  document.body.appendChild(tipEl);
  document.addEventListener('mousemove', e => {
    const t = e.target.closest('[data-tip]');
    if (!t) { tipEl.style.display = 'none'; return; }
    tipEl.innerHTML = t.getAttribute('data-tip');
    tipEl.style.display = 'block';
    const r = tipEl.getBoundingClientRect();
    tipEl.style.left = Math.min(e.clientX + 13, innerWidth - r.width - 10) + 'px';
    tipEl.style.top = Math.max(8, e.clientY - r.height - 11) + 'px';
  });
  document.addEventListener('mouseleave', () => tipEl.style.display = 'none');
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   4 · CHARTS
   Measured, not stretched: each chart is built after layout so the SVG is
   drawn at the width it will be shown at. No preserveAspectRatio tricks, so
   rounded data-ends stay round and labels stay legible.
   ═══════════════════════════════════════════════════════════════════════════ */
const CH = [];                                       // charts queued by the view, mounted after paint
const queueChart = (kind, cfg) => { const id = 'ch' + CH.length; CH.push({ id, kind, cfg }); return `<div id="${id}"></div>`; };

function seriesOf(rows, dim, meas, cap = 5) {
  const g = {};
  rows.forEach(r => { const k = DIMS[dim].of(r); (g[k] = g[k] || []).push(r); });
  let entries = Object.entries(g).map(([k, rs]) => [k, MEAS[meas].of(rs), rs]).sort((a,b) => b[1]-a[1]);
  if (entries.length > cap) {
    const rest = entries.slice(cap);
    const restRows = rest.flatMap(e => e[2]);
    entries = entries.slice(0, cap).concat([[`Other · ${rest.length} more`, MEAS[meas].of(restRows), restRows]]);
  }
  return entries.map(([k, v, rs], i) => ({ key:k, val:v, rows:rs, color:i < 5 ? PALETTE[i] : 'var(--text-muted)' }));
}

function mountCharts() {
  for (const c of CH) {
    const host = document.getElementById(c.id);
    if (!host) continue;
    const w = Math.max(260, host.parentElement.clientWidth - 2);
    host.innerHTML = c.kind === 'time' ? chartTime(c.cfg, w) : c.kind === 'spread' ? chartSpread(c.cfg, w) : '';
  }
  CH.length = 0;
}

/* stacked columns over time — magnitude by period, identity by colour + legend */
function chartTime({ rows, dim, meas, grain }, W) {
  const H = 196, PL = 46, PR = 8, PT = 12, PB = 26;
  const periods = [...new Set(rows.map(r => periodOf(r.start, grain)).filter(Boolean))].sort();
  if (!periods.length) return '<div class="empty">Nothing with a start date in this selection.</div>';
  const ser = seriesOf(rows, dim, meas);
  const cell = {};
  ser.forEach(s => { cell[s.key] = {}; periods.forEach(p => cell[s.key][p] = MEAS[meas].of(s.rows.filter(r => periodOf(r.start, grain) === p))); });
  const totals = periods.map(p => ser.reduce((a,s) => a + cell[s.key][p], 0));
  const max = Math.max(1, ...totals);
  const nice = Math.pow(10, Math.floor(Math.log10(max))) * (max / Math.pow(10, Math.floor(Math.log10(max))) > 5 ? 10 : max / Math.pow(10, Math.floor(Math.log10(max))) > 2 ? 5 : 2);
  const iw = W - PL - PR, ih = H - PT - PB;
  const bw = Math.max(5, Math.min(34, iw / periods.length - 4));
  const x = i => PL + (i + .5) * (iw / periods.length) - bw/2;
  const y = v => PT + ih - (v / nice) * ih;
  let g = '';
  for (let k = 0; k <= 2; k++) { const v = nice * k/2; g += `<line x1="${PL}" x2="${W-PR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${PL-7}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--text-muted)">${MEAS[meas].fmt(v)}</text>`; }
  let bars = '';
  periods.forEach((p, i) => {
    let acc = 0;
    ser.forEach(s => {
      const v = cell[s.key][p]; if (!v) return;
      const h = (v / nice) * ih; const top = y(acc + v);
      const tip = `<b>${esc(p)}</b><div class="row"><span>${esc(s.key)}</span><span>${MEAS[meas].fmt(v)}</span></div><div class="row"><span>All</span><span>${MEAS[meas].fmt(totals[i])}</span></div>`;
      bars += `<rect x="${x(i)}" y="${top}" width="${bw}" height="${Math.max(1, h - 2)}" rx="${acc + v >= totals[i] - .01 ? 3 : 0}" fill="${s.color}" data-tip="${esc(tip)}"/>`;
      acc += v;
    });
    const step = periods.length > 14 ? Math.ceil(periods.length / 7) : 1;
    if (i % step === 0 || i === periods.length - 1)
      bars += `<text x="${x(i)+bw/2}" y="${H-9}" text-anchor="middle" font-size="9.5" fill="var(--text-muted)">${esc(grain === 'month' ? p.slice(2) : p)}</text>`;
  });
  const legend = ser.map(s => `<span class="pill" style="box-shadow:none;background:none;padding:0 6px 0 0"><i class="sw" style="background:${s.color}"></i>${esc(s.key)}</span>`).join('');
  return `<svg width="${W}" height="${H}" role="img">${g}${bars}</svg>
    <div style="display:flex;flex-wrap:wrap;gap:3px 2px;margin-top:4px">${legend}</div>`;
}

/* amount spread — one row per group, every record a dot. Variance you can see. */
function chartSpread({ rows, dim }, W) {
  const groups = {};
  rows.filter(r => r.amount).forEach(r => { const k = DIMS[dim].of(r); (groups[k] = groups[k] || []).push(r); });
  let gs = Object.entries(groups).map(([k, rs]) => {
    const a = rs.map(r => monthlyOf(r)).filter(v => v > 0).sort((x,y) => x-y);
    return { k, rs, lo:a[0] || 0, hi:a[a.length-1] || 0, mid:a[Math.floor(a.length/2)] || 0, n:rs.length };
  }).filter(g => g.n).sort((a,b) => b.n - a.n).slice(0, 9);
  if (!gs.length) return '<div class="empty">No amounts recorded in this selection.</div>';
  const LW = Math.min(150, Math.max(76, W * .34)), PR = 96;
  const max = Math.max(...gs.map(g => g.hi)) * 1.06 || 1;
  const rowH = 26, H = gs.length * rowH + 20;
  const sx = v => LW + (v / max) * (W - LW - PR);
  let out = '';
  gs.forEach((g, i) => {
    const cy = i * rowH + 15;
    out += `<text x="0" y="${cy+3.5}" font-size="10.5" fill="var(--text-dim)">${esc(g.k.length > 20 ? g.k.slice(0,19) + '…' : g.k)}</text>`;
    out += `<line x1="${sx(g.lo)}" x2="${sx(g.hi)}" y1="${cy}" y2="${cy}" stroke="var(--track)" stroke-width="7" stroke-linecap="round"/>`;
    const seen = {};
    g.rs.forEach(r => { const v = monthlyOf(r); if (!v) return; const key = Math.round(v); seen[key] = (seen[key]||0) + 1; });
    Object.entries(seen).forEach(([v, n]) => {
      const rr = Math.min(7, 3.2 + Math.log2(n) * 1.2);
      out += `<circle cx="${sx(+v)}" cy="${cy}" r="${rr}" fill="${g.lo === g.hi ? 'var(--c3)' : 'var(--c1)'}" stroke="var(--bg-panel)" stroke-width="2" data-tip="${esc(`<b>${g.k}</b><div class="row"><span>${inr(+v)}/mo</span><span>${n} record${n>1?'s':''}</span></div>`)}"/>`;
    });
    const label = g.lo === g.hi ? inr(g.lo) : `${inr(g.lo)}–${inr(g.hi)}`;
    out += `<text x="${W-2}" y="${cy+3.5}" text-anchor="end" font-size="10" fill="${g.lo===g.hi?'var(--text-muted)':'var(--amber)'}" class="num">${esc(label)}</text>`;
  });
  return `<svg width="${W}" height="${H}" role="img">${out}</svg>
    <div class="hint" style="margin-top:6px"><i class="sw" style="background:var(--c3)"></i> one price &nbsp; <i class="sw" style="background:var(--c1)"></i> several prices for the same group &nbsp;·&nbsp; dot size = how many records sit on that price</div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   5 · EXPLORE
   ═══════════════════════════════════════════════════════════════════════════ */
function viewExplore() {
  const rows = filtered();
  const all = RECORDS.filter(r => S.incSuperseded || r.status !== 'superseded');
  const comp = rows.filter(r => completeness(r) === CORE.length).length;
  const kpi = (k, v, s) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  const kpis = `<div class="kpis">
    ${kpi('Records', rows.length.toLocaleString('en-IN'), rows.length === all.length ? 'the whole book' : `of ${all.length} · filtered`)}
    ${kpi('Properties', new Set(rows.map(r => r.pid)).size, `of ${PROPS.length} on the books`)}
    ${kpi('Monthly run-rate', inrK(sum(rows, monthlyOf)), 'every bill reduced to a month')}
    ${kpi('Annualised', inrK(sum(rows, annualOf)), 'what a full year costs')}
    ${kpi('Fully recorded', rows.length ? Math.round(comp/rows.length*100) + '%' : '—', `${comp} of ${rows.length} have all ${CORE.length} fields`)}
  </div>`;

  const ser = seriesOf(rows, S.group, S.measure, 12);
  const total = MEAS[S.measure].of(rows) || 1;
  const maxV = Math.max(...ser.map(s => s.val), 1);
  const g2 = S.group2;

  const groupRows = ser.map((s, i) => {
    const open = !!S.expand[s.key];
    const sub = (g2 !== 'none' && open) ? seriesOf(s.rows, g2, S.measure, 8) : [];
    const subMax = Math.max(...sub.map(x => x.val), 1);
    const head = `<tr data-act="expand" data-k="${esc(s.key)}" style="cursor:${g2!=='none'?'pointer':'default'}">
      <td style="width:1%;color:var(--text-muted)">${g2 !== 'none' ? (open ? '▾' : '▸') : ''}</td>
      <td><span class="sw" style="background:${s.color};margin-right:7px;vertical-align:-1px"></span><span class="drill" data-act="drill" data-dim="${S.group}" data-v="${esc(s.key)}">${esc(s.key)}</span></td>
      <td style="width:34%"><div class="track"><div class="bar" style="width:${Math.max(2, s.val/maxV*100)}%;background:${s.color}" data-tip="${esc(`<b>${s.key}</b><div class="row"><span>${MEAS[S.measure].label}</span><span>${MEAS[S.measure].fmt(s.val)}</span></div><div class="row"><span>Share</span><span>${(s.val/total*100).toFixed(1)}%</span></div>`)}"></div></div></td>
      <td class="r num" style="font-weight:600">${MEAS[S.measure].fmt(s.val)}</td>
      <td class="r num" style="color:var(--text-dim)">${(s.val/total*100).toFixed(1)}%</td>
      <td class="r num" style="color:var(--text-dim)">${s.rows.length}</td>
      <td class="r num" style="color:var(--text-dim)">${new Set(s.rows.map(r => r.pid)).size}</td>
    </tr>`;
    const subs = sub.map(x => `<tr style="background:var(--bg-sunken)">
      <td></td>
      <td style="padding-left:22px;color:var(--text-dim)"><span class="drill" data-act="drill2" data-dim="${g2}" data-v="${esc(x.key)}" data-pdim="${S.group}" data-pv="${esc(s.key)}">${esc(x.key)}</span></td>
      <td><div class="track" style="height:7px"><div class="bar" style="height:7px;width:${Math.max(2, x.val/subMax*100)}%;background:${s.color};opacity:.72"></div></div></td>
      <td class="r num">${MEAS[S.measure].fmt(x.val)}</td>
      <td class="r num" style="color:var(--text-muted)">${(x.val/s.val*100).toFixed(0)}%</td>
      <td class="r num" style="color:var(--text-muted)">${x.rows.length}</td>
      <td class="r num" style="color:var(--text-muted)">${new Set(x.rows.map(r => r.pid)).size}</td>
    </tr>`).join('');
    return head + subs;
  }).join('');

  const dimOpts = (cur, extra) => (extra ? `<option value="none"${cur==='none'?' selected':''}>— nothing —</option>` : '') +
    Object.entries(DIMS).map(([k,d]) => `<option value="${k}"${cur===k?' selected':''}>${d.label}</option>`).join('');

  return `${kpis}
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 11px">
    <span class="lbl">Group by</span>
    <select class="sel" data-act="set" data-key="group">${dimOpts(S.group)}</select>
    <span class="lbl">then</span>
    <select class="sel" data-act="set" data-key="group2">${dimOpts(S.group2, true)}</select>
    <span class="lbl" style="margin-left:6px">Measured by</span>
    <select class="sel" data-act="set" data-key="measure">${Object.entries(MEAS).map(([k,m]) => `<option value="${k}"${S.measure===k?' selected':''}>${m.label}</option>`).join('')}</select>
    <span style="flex:1"></span>
    <span class="hint">Click any name to filter everything by it.</span>
  </div>
  <div class="grid2">
    <div class="card">
      <header><h3>${esc(DIMS[S.group].label)} — by ${esc(MEAS[S.measure].label.toLowerCase())}</h3><span class="sp"></span>
        <span class="hint">${ser.length} group${ser.length>1?'s':''} · ${MEAS[S.measure].fmt(total)} ${MEAS[S.measure].unit}</span></header>
      <div class="scrollx"><table class="t"><thead><tr><th></th><th>${esc(DIMS[S.group].label)}</th><th></th>
        <th class="r">${esc(MEAS[S.measure].label)}</th><th class="r">Share</th><th class="r">Records</th><th class="r">Props</th></tr></thead>
        <tbody>${groupRows || '<tr><td colspan="7"><div class="empty"><b>Nothing matches</b>Loosen a filter above.</div></td></tr>'}</tbody></table></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="card">
        <header><h3>When these were installed</h3><span class="sp"></span>
          <span class="seg">${['month','quarter','year'].map(g => `<button data-act="set" data-key="grain" data-v="${g}" class="${S.grain===g?'on':''}">${g[0].toUpperCase()+g.slice(1)}</button>`).join('')}</span></header>
        <div class="body">${queueChart('time', { rows, dim:S.group, meas:S.measure, grain:S.grain })}</div>
      </div>
      <div class="card">
        <header><h3>What one connection costs a month</h3><span class="sp"></span><span class="hint">by ${esc(DIMS[S.group].label.toLowerCase())}</span></header>
        <div class="body">${queueChart('spread', { rows, dim:S.group })}</div>
      </div>
    </div>
  </div>`;
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   6 · RECORDS — the book itself
   ═══════════════════════════════════════════════════════════════════════════ */
const COLS = {
  pid:      { label:'Property', w:'', get:r => `<div style="min-width:150px"><b class="mono">${r.pid}</b> &nbsp;<span style="color:var(--text-dim)">${esc(PROP[r.pid] ? PROP[r.pid].name : '—')}</span><div class="hint">${esc(PROP[r.pid] ? PROP[r.pid].loc : '')}</div></div>` },
  type:     { label:'Type',     get:r => `<span class="pill"><i class="sw" style="background:${TYPE[r.type].color}"></i>${TYPE[r.type].label}</span>` },
  provider: { label:'Provider', get:r => esc(r.provider) },
  plan:     { label:'Plan',     get:r => r.plan ? esc(r.plan) : '<i style="color:var(--red)">not recorded</i>' },
  cycle:    { label:'Cycle',    get:r => r.cycle ? esc(r.cycle) : '<i style="color:var(--red)">—</i>' },
  amount:   { label:'Bill',     r:true, get:r => r.amount ? `<span class="num">${inr(r.amount)}</span>` : '<i style="color:var(--red)">—</i>' },
  monthly:  { label:'Per month',r:true, get:r => monthlyOf(r) ? `<span class="num">${inr(monthlyOf(r))}</span>` : '<span style="color:var(--text-muted)">—</span>' },
  annual:   { label:'Per year', r:true, get:r => annualOf(r) ? `<span class="num">${inr(annualOf(r))}</span>` : '<span style="color:var(--text-muted)">—</span>' },
  start:    { label:'Started',  get:r => r.start ? `<span class="num" style="color:var(--text-dim)">${r.start}</span>` : '<i style="color:var(--red)">—</i>' },
  lastRech: { label:'Last paid',get:r => r.lastRech ? `<span class="num" style="color:var(--text-dim)">${r.lastRech}</span>` : '<span style="color:var(--text-muted)">not logged</span>' },
  account:  { label:'Account',  get:r => r.account ? `<span class="mono" style="color:var(--text-dim)">${esc(r.account)}</span>` : '<i style="color:var(--red)">—</i>' },
  invoice:  { label:'Invoice',  get:r => r.invoice ? '<span class="pill ok">✓ on file</span>' : '<span class="pill warn">none</span>' },
  payMode:  { label:'Who pays', get:r => esc(r.payMode) },
  source:   { label:'Source',   get:r => `<span style="color:var(--text-dim)">${esc(r.source)}</span>` },
  updatedAt:{ label:'Updated',  get:r => `<span class="num" style="color:var(--text-dim)">${r.updatedAt}</span>` },
  status:   { label:'Status',   get:r => { const m = { active:'ok', superseded:'', cancelled:'bad', unknown:'warn' }[r.status]; return `<span class="pill ${m}">${r.status}</span>`; } },
  complete: { label:'Complete', get:r => { const c = completeness(r), miss = missingOf(r);
      return `<span class="meter" data-tip="${esc(`<b>${c} of ${CORE.length} fields</b>` + (miss.length ? miss.map(m => `<div class="row"><span>${m.label}</span><span style="color:var(--red)">missing</span></div>`).join('') : '<div class="row"><span>Nothing missing</span></div>'))}">${CORE.map((_,i) => `<i class="${i < c ? (c === CORE.length ? 'f' : 'p') : ''}"></i>`).join('')}</span>`; } },
};
const SORTABLE = { pid:r => +r.pid, type:r => r.type, provider:r => r.provider, plan:r => r.plan || '', cycle:r => CYCLE_M[r.cycle] || 99,
  amount:r => r.amount || 0, monthly:monthlyOf, annual:annualOf, start:r => r.start || '', lastRech:r => r.lastRech || '',
  account:r => r.account || '', invoice:r => r.invoice ? 1 : 0, payMode:r => r.payMode, source:r => r.source,
  updatedAt:r => r.updatedAt, status:r => r.status, complete:completeness };

function viewRecords() {
  let rows = [...filtered()];
  const f = SORTABLE[S.sort.col];
  if (f) rows.sort((a,b) => { const x = f(a), y = f(b); return (x > y ? 1 : x < y ? -1 : 0) * S.sort.dir; });
  const th = k => `<th class="${COLS[k].r ? 'r ' : ''}sortable" data-act="sort" data-k="${k}">${COLS[k].label}${S.sort.col === k ? (S.sort.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`;
  const picker = Object.keys(COLS).map(k => `<label style="display:flex;gap:7px;align-items:center;padding:4px 9px;font-size:12px;white-space:nowrap">
      <input type="checkbox" data-act="col" data-k="${k}" ${S.cols.includes(k) ? 'checked' : ''}> ${COLS[k].label}</label>`).join('');
  return `<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px">
      <h2 style="font-size:15px">${rows.length.toLocaleString('en-IN')} record${rows.length === 1 ? '' : 's'}</h2>
      <span class="hint">${S.idSet ? esc(S.idSetLabel) : 'the whole book, newest filter first'}</span>
      <span style="flex:1"></span>
      <details style="position:relative"><summary class="btn" style="list-style:none">▦ Columns</summary>
        <div class="card" style="position:absolute;right:0;top:32px;z-index:20;padding:5px;box-shadow:var(--shadow);max-height:300px;overflow:auto">${picker}</div></details>
      <button class="btn" data-act="csv">↓ CSV</button>
    </div>
    <div class="card"><div class="scrollx tallish" style="max-height:min(70vh,700px)">
      <table class="t"><thead><tr>${S.cols.map(th).join('')}</tr></thead>
      <tbody>${rows.length ? rows.map(r => `<tr data-act="open" data-id="${r.id}" style="cursor:pointer">${S.cols.map(k => `<td class="${COLS[k].r ? 'r' : ''}">${COLS[k].get(r)}</td>`).join('')}</tr>`).join('')
        : '<tr><td><div class="empty"><b>No record matches</b>Clear a filter, or search for a PID, provider, account number or SSID.</div></td></tr>'}</tbody></table>
    </div></div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   7 · WHAT THE BOOK DOES NOT SAY — and what it says twice
   ═══════════════════════════════════════════════════════════════════════════ */
function viewQuality() {
  const sel = CHECKS.find(c => c.id === S.check) || CHECKS[0];
  const list = fam => CHECKS.filter(c => c.fam === fam).map(c => `<button class="navitem ${c.id === sel.id ? 'on' : ''}" data-act="check" data-k="${c.id}" style="width:100%">
      <span class="ico" style="color:var(--${c.sev === 'bad' ? 'red' : 'amber'})">${c.sev === 'bad' ? '◆' : '◇'}</span>
      <span style="min-width:0">${esc(c.label)}</span><span class="cnt ${c.sev === 'bad' ? '' : 'warn'}">${c.rows.length}</span></button>`).join('');

  const noWifi  = COVERAGE.filter(p => !p.wifi);
  const noWater = COVERAGE.filter(p => !p.water);
  const bare    = COVERAGE.filter(p => !p.n);

  let ev = '';
  if (sel.id === 'c-spell') ev = `<div class="body" style="border-bottom:1px solid var(--border)">
      ${sel.ev.map(e => `<div style="margin-bottom:9px"><div style="font-size:12px;font-weight:600;margin-bottom:4px">${esc(e.head)}</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap">${e.parts.map(([p,n]) => `<span class="chip" style="padding-right:9px"><b class="mono">${esc(p)}</b><i>×${n}</i></span>`).join('')}</div></div>`).join('')}
      <div class="hint" style="margin-top:4px">Normalising the text would merge these into one plan, and only then does “are we all paying the same?” have an answer.</div></div>`;
  if (sel.id === 'c-price') ev = `<div class="body" style="border-bottom:1px solid var(--border)">
      <table class="t"><thead><tr><th>Provider · plan · cycle</th><th>Amounts on the records</th><th class="r">Spread</th><th class="r">Records</th></tr></thead>
      <tbody>${sel.ev.map(e => `<tr><td>${esc(e.head)}</td>
        <td><div style="display:flex;gap:5px;flex-wrap:wrap">${e.parts.map(([a,n]) => `<span class="chip" style="padding-right:9px"><b class="num">${esc(a)}</b><i>×${n}</i></span>`).join('')}</div></td>
        <td class="r num" style="color:var(--amber);font-weight:600">${inr(e.spread)}</td><td class="r num">${e.n}</td></tr>`).join('')}</tbody></table></div>`;

  const sample = sel.rows.slice(0, 60);
  return `<div class="gq">
    <div class="card"><header><h3>What to look at</h3></header><div style="padding:7px">
      <div class="grp" style="padding:4px 8px 5px">Contradictions — these cannot all be true</div>${list('con')}
      <div class="grp" style="padding:11px 8px 5px">Gaps — these were never filled in</div>${list('gap')}
    </div></div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="card">
        <header><h3>${esc(sel.label)}</h3><span class="sp"></span>
          <span class="pill ${sel.sev === 'bad' ? 'bad' : 'warn'}">${sel.rows.length} records</span>
          <button class="btn" data-act="toRecords" data-k="${sel.id}">Open these in Records →</button></header>
        <div class="body" style="border-bottom:1px solid var(--border)"><p style="margin:0;color:var(--text-dim);font-size:12.5px;max-width:74ch">${esc(sel.why)}</p></div>
        ${ev}
        <div class="scrollx" style="max-height:340px;overflow:auto"><table class="t">
          <thead><tr><th>Property</th><th>Type</th><th>Provider</th><th>Plan</th><th class="r">Bill</th><th>Status</th><th class="r">Complete</th></tr></thead>
          <tbody>${sample.map(r => `<tr data-act="open" data-id="${r.id}" style="cursor:pointer">
            <td>${COLS.pid.get(r)}</td><td>${COLS.type.get(r)}</td><td>${esc(r.provider)}</td><td>${COLS.plan.get(r)}</td>
            <td class="r">${COLS.amount.get(r)}</td><td>${COLS.status.get(r)}</td><td class="r">${COLS.complete.get(r)}</td></tr>`).join('')}
          </tbody></table>
          ${sel.rows.length > 60 ? `<div class="hint" style="padding:9px 11px">Showing 60 of ${sel.rows.length}. The rest are in Records, filtered.</div>` : ''}
        </div>
      </div>
      <div class="card">
        <header><h3>Coverage — what a property has, and has not</h3><span class="sp"></span><span class="hint">${PROPS.length} properties</span></header>
        <div class="body" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">
          ${[['No WiFi record', noWifi, 'c1'], ['No water purifier', noWater, 'c3'], ['No utility at all', bare, 'c5']].map(([l, arr, c]) =>
            `<div style="background:var(--bg-input);border-radius:9px;padding:10px 11px">
              <div class="k lbl">${l}</div><div style="font-size:21px;font-weight:600;margin-top:4px" class="num">${arr.length}</div>
              <div class="hint">${arr.length ? arr.slice(0,6).map(p => `<span class="mono">${p.pid}</span>`).join(' ') + (arr.length > 6 ? ' …' : '') : 'none'}</div></div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   8 · COMPARE
   ═══════════════════════════════════════════════════════════════════════════ */
function viewCompare() {
  const rows = filtered();
  const tabs = [['bench','Provider by provider'],['bands','Price for the same plan'],['props','Cost per property']];
  const head = `<div style="display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap">
    <span class="seg">${tabs.map(([k,l]) => `<button data-act="set" data-key="cmp" data-v="${k}" class="${S.cmp===k?'on':''}">${l}</button>`).join('')}</span>
    <span class="hint">${rows.length} records in scope</span></div>`;

  if (S.cmp === 'bench') {
    const g = {}; rows.forEach(r => (g[r.provider] = g[r.provider] || []).push(r));
    const t = Object.entries(g).map(([p, rs]) => ({ p, n:rs.length, props:new Set(rs.map(r => r.pid)).size,
      monthly:sum(rs, monthlyOf), annual:sum(rs, annualOf),
      per: rs.filter(monthlyOf).length ? sum(rs, monthlyOf) / rs.filter(monthlyOf).length : 0,
      plan:rs.filter(r => r.plan).length / rs.length, inv:rs.filter(r => r.invoice).length / rs.length, acc:rs.filter(r => r.account).length / rs.length }))
      .sort((a,b) => b.annual - a.annual);
    const maxA = Math.max(...t.map(x => x.annual), 1);
    const pct = v => `<span class="num" style="color:${v > .8 ? 'var(--green)' : v > .4 ? 'var(--text-dim)' : 'var(--red)'}">${Math.round(v*100)}%</span>`;
    return head + `<div class="card"><div class="scrollx"><table class="t">
      <thead><tr><th>Provider</th><th class="r">Records</th><th class="r">Properties</th><th class="r">Avg / connection / mo</th><th class="r">Annualised</th><th style="width:20%"></th><th class="r">Plan recorded</th><th class="r">Account no.</th><th class="r">Invoice on file</th></tr></thead>
      <tbody>${t.map((x,i) => `<tr><td><span class="sw" style="background:${PALETTE[i%5]};margin-right:7px"></span><span class="drill" data-act="drill" data-dim="provider" data-v="${esc(x.p)}">${esc(x.p)}</span></td>
        <td class="r num">${x.n}</td><td class="r num">${x.props}</td><td class="r num">${x.per ? inr(x.per) : '—'}</td>
        <td class="r num" style="font-weight:600">${inrK(x.annual)}</td>
        <td><div class="track"><div class="bar" style="width:${Math.max(2, x.annual/maxA*100)}%;background:${PALETTE[i%5]}"></div></div></td>
        <td class="r">${pct(x.plan)}</td><td class="r">${pct(x.acc)}</td><td class="r">${pct(x.inv)}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="hint" style="margin-top:8px">The last three columns are not about money — they are how trustworthy that provider's records are. A provider with 72% of invoices missing is a provider you cannot audit.</div>`;
  }

  if (S.cmp === 'bands') {
    const g = {}; rows.filter(r => r.planCanon && r.cycle && r.amount).forEach(r => { const k = `${r.provider}|${r.planCanon}|${r.cycle}`; (g[k] = g[k] || []).push(r); });
    const t = Object.entries(g).map(([k, rs]) => { const a = rs.map(r => r.amount).sort((x,y) => x-y);
      return { k, rs, lo:a[0], hi:a[a.length-1], mid:a[Math.floor(a.length/2)], n:rs.length, spread:a[a.length-1]-a[0] }; })
      .sort((a,b) => (b.spread ? 1 : 0) - (a.spread ? 1 : 0) || b.n - a.n);
    const max = Math.max(...t.map(x => x.hi), 1);
    return head + `<div class="card"><div class="scrollx"><table class="t">
      <thead><tr><th>Provider · plan · cycle</th><th class="r">Records</th><th style="width:40%">Price on the records</th><th class="r">Low</th><th class="r">High</th><th class="r">Spread</th></tr></thead>
      <tbody>${t.map(x => { const [p,pl,c] = x.k.split('|');
        const dots = [...new Set(x.rs.map(r => r.amount))].map(v => `<span data-tip="${esc(`<b>${inr(v)}</b><div class="row"><span>records on this price</span><span>${x.rs.filter(r=>r.amount===v).length}</span></div>`)}" style="position:absolute;left:${(v/max*100).toFixed(2)}%;top:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:${x.spread?'var(--c1)':'var(--c3)'};box-shadow:0 0 0 2px var(--bg-panel)"></span>`).join('');
        return `<tr><td><b>${esc(p)}</b> · ${esc(pl)} <span class="hint">· ${esc(c.toLowerCase())}</span></td>
          <td class="r num">${x.n}</td>
          <td><div style="position:relative;height:16px"><div style="position:absolute;left:${(x.lo/max*100).toFixed(2)}%;right:${(100-x.hi/max*100).toFixed(2)}%;top:50%;transform:translateY(-50%);height:7px;border-radius:4px;background:var(--track);min-width:7px"></div>${dots}</div></td>
          <td class="r num">${inr(x.lo)}</td><td class="r num">${inr(x.hi)}</td>
          <td class="r num" style="color:${x.spread ? 'var(--amber)' : 'var(--text-muted)'};font-weight:${x.spread?600:400}">${x.spread ? inr(x.spread) : '—'}</td></tr>`; }).join('')}
      </tbody></table></div></div>
      <div class="hint" style="margin-top:8px">Grouped on the <b>normalised</b> plan, so the five spellings of ACT's 200 Mbps mesh land in one row. Grouped on the raw text they would look like five tidy plans with no variance at all.</div>`;
  }

  const t = COVERAGE.map(p => ({ ...p, rows:RECORDS.filter(r => r.pid === p.pid && (S.incSuperseded || r.status !== 'superseded')) }))
    .map(p => ({ ...p, monthly:sum(p.rows, monthlyOf), annual:sum(p.rows, annualOf) }))
    .filter(p => p.rows.length).sort((a,b) => b.annual - a.annual);
  const maxA = Math.max(...t.map(x => x.annual), 1);
  return head + `<div class="card"><div class="scrollx tallish"><table class="t">
    <thead><tr><th>Property</th><th>Locality</th><th class="r">Records</th><th>Has</th><th class="r">Per month</th><th class="r">Per year</th><th style="width:18%"></th><th class="r">Per unit / mo</th></tr></thead>
    <tbody>${t.map(p => `<tr data-act="drill" data-dim="pid" data-v="${p.pid}" style="cursor:pointer">
      <td><b class="mono">${p.pid}</b> <span style="color:var(--text-dim)">${esc(p.name)}</span></td><td style="color:var(--text-dim)">${esc(p.loc)}</td>
      <td class="r num">${p.rows.length}</td>
      <td>${[...new Set(p.rows.map(r => r.type))].map(t2 => `<span class="pill" style="margin-right:3px"><i class="sw" style="background:${TYPE[t2].color}"></i>${TYPE[t2].label}</span>`).join('')}</td>
      <td class="r num">${inr(p.monthly)}</td><td class="r num" style="font-weight:600">${inr(p.annual)}</td>
      <td><div class="track"><div class="bar" style="width:${Math.max(2, p.annual/maxA*100)}%;background:var(--c1)"></div></div></td>
      <td class="r num" style="color:var(--text-dim)">${inr(p.monthly / p.units)}</td></tr>`).join('')}</tbody></table></div></div>`;
}
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   9 · THE RECORD
   The centre of a record-keeping system is not a dashboard, it is one record
   seen whole: every field, what is missing from it, the other connections at
   that property, the chain of what it replaced, and who changed what when.
   ═══════════════════════════════════════════════════════════════════════════ */
let reveal = false;
function viewSheet(r) {
  const p = PROP[r.pid] || { name:'—', loc:'—', units:0 };
  const miss = missingOf(r), c = completeness(r);
  const siblings = RECORDS.filter(x => x.pid === r.pid && x.id !== r.id);
  const chain = [];
  let cur = r; while (cur.supersedes) { cur = RECORDS.find(x => x.id === cur.supersedes); if (!cur) break; chain.push(cur); }
  const succ = r.supersededBy ? RECORDS.find(x => x.id === r.supersededBy) : null;
  const f = (label, val, missing) => `<dt>${label}</dt><dd class="${missing ? 'miss' : ''}">${missing ? 'not recorded' : val}</dd>`;
  const next = (r.cycle && (r.lastRech || r.start)) ? addM(D(r.lastRech || r.start), CYCLE_M[r.cycle]) : null;

  return `<div class="scrim" data-act="close"></div><aside class="sheet">
    <header>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="pill"><i class="sw" style="background:${TYPE[r.type].color}"></i>${TYPE[r.type].label}</span>
          ${COLS.status.get(r)}
          <span class="hint mono">${r.id}</span>
        </div>
        <h2 style="font-size:16px;margin-top:7px;letter-spacing:-.01em">${esc(r.provider)}${r.plan ? ' · ' + esc(r.plan) : ''}</h2>
        <div class="hint" style="margin-top:3px">PID <b class="mono">${r.pid}</b> · ${esc(p.name)} · ${esc(p.loc)} · ${p.units} units</div>
      </div>
      <button class="btn ghost" data-act="close" style="font-size:16px;flex:none">✕</button>
    </header>
    <div class="scroll">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px">
        <div class="kpi" style="padding:9px 11px"><div class="k">Bill</div><div class="v" style="font-size:17px">${r.amount ? inr(r.amount) : '—'}</div><div class="s">${esc(r.cycle || 'cycle not recorded')}</div></div>
        <div class="kpi" style="padding:9px 11px"><div class="k">Per month</div><div class="v" style="font-size:17px">${monthlyOf(r) ? inr(monthlyOf(r)) : '—'}</div><div class="s">${annualOf(r) ? inr(annualOf(r)) + ' a year' : 'cannot be derived'}</div></div>
        <div class="kpi" style="padding:9px 11px"><div class="k">Completeness</div><div class="v" style="font-size:17px">${c}<span style="font-size:12px;color:var(--text-muted)">/${CORE.length}</span></div><div class="s">${miss.length ? miss.length + ' field' + (miss.length>1?'s':'') + ' missing' : 'nothing missing'}</div></div>
      </div>

      ${miss.length ? `<div class="card" style="margin-top:12px;border-color:var(--border-dash)"><div class="body">
        <div class="lbl" style="margin-bottom:6px">What this record does not say</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap">${miss.map(m => `<span class="chip" style="padding-right:9px;color:var(--red)">${m.label}</span>`).join('')}</div>
      </div></div>` : ''}

      <div class="sectitle">Service</div>
      <dl class="fgrid">
        ${f('Provider', esc(r.provider))}
        ${f('Plan as typed', '<span class="mono">' + esc(r.plan) + '</span>', !r.plan)}
        ${f('Plan normalised', r.planCanon ? esc(r.planCanon) + (r.plan && r.plan !== r.planCanon ? ' <span class="hint">· differs from what was typed</span>' : '') : '', !r.planCanon)}
        ${f('Account number', '<span class="mono">' + esc(r.account) + '</span>', !r.account)}
        ${f('Started', '<span class="num">' + esc(r.start) + '</span>' + (r.start ? ` <span class="hint">· ${Math.round(daysBetween(D(r.start), TODAY)/30.4)} months ago</span>` : ''), !r.start)}
      </dl>

      <div class="sectitle">Billing</div>
      <dl class="fgrid">
        ${f('Amount', '<span class="num">' + inr(r.amount) + '</span>', !r.amount)}
        ${f('Cycle', esc(r.cycle), !r.cycle)}
        ${f('One-off cost', r.addedCost ? inr(r.addedCost) + ' <span class="hint">· installation / deposit</span>' : '<span style="color:var(--text-muted)">none recorded</span>')}
        ${f('Who pays', esc(r.payMode))}
        ${f('Last paid', r.lastRech ? '<span class="num">' + r.lastRech + '</span>' : '<span style="color:var(--text-muted)">never logged</span>')}
        ${f('Period after that', next ? '<span class="num">' + iso(next) + '</span>' + (next < TODAY ? ` <span class="pill bad" style="margin-left:6px">${Math.abs(daysBetween(next, TODAY))} days past</span>` : ` <span class="hint">· in ${daysBetween(TODAY, next)} days</span>`) : '<span style="color:var(--text-muted)">cannot be derived</span>')}
        ${f('Invoice', r.invoice ? `<a href="#" onclick="return false">${esc(r.invoice.split('/').pop())}</a>` : '', !r.invoice)}
      </dl>

      ${r.type === 'wifi' ? `<div class="sectitle">Access <button class="btn ghost" data-act="reveal" style="height:20px;font-size:11px;padding:0 6px">${reveal ? 'hide' : 'reveal'}</button></div>
      <dl class="fgrid">
        ${f('SSID', '<span class="mono">' + esc(r.ssid) + '</span>', !r.ssid)}
        ${f('WiFi password', '<span class="mono">' + (reveal ? esc(r.password) : '••••••••') + '</span>', !r.password)}
        ${f('Lockbox code', '<span class="mono">' + (reveal ? esc(r.lockbox) : '••••') + '</span>', !r.lockbox)}
      </dl>` : ''}

      ${(chain.length || succ) ? `<div class="sectitle">What was here before</div>
        <div class="card"><div style="padding:3px 0">
          ${succ ? `<div style="padding:9px 13px;border-bottom:1px solid var(--border);font-size:12.5px">Replaced by <span class="drill" data-act="open" data-id="${succ.id}">${esc(succ.provider)} · ${esc(succ.plan || '—')}</span> on <span class="num">${succ.start}</span></div>` : ''}
          ${chain.map(x => `<div style="padding:9px 13px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:baseline;font-size:12.5px">
            <span class="num" style="color:var(--text-muted);flex:none">${x.start}</span>
            <span style="flex:1"><span class="drill" data-act="open" data-id="${x.id}">${esc(x.provider)} · ${esc(x.plan || '—')}</span></span>
            <span class="num" style="color:var(--text-dim)">${inr(x.amount)}</span>
            <span class="hint">${x.amount && r.amount ? (r.amount > x.amount ? '+' : '') + Math.round((r.amount - x.amount) / x.amount * 100) + '%' : ''}</span></div>`).join('')}
        </div></div>` : ''}

      ${siblings.length ? `<div class="sectitle">Everything else at PID ${r.pid}</div>
        <div class="card"><table class="t"><tbody>
          ${siblings.map(x => `<tr data-act="open" data-id="${x.id}" style="cursor:pointer">
            <td>${COLS.type.get(x)}</td><td>${esc(x.provider)}</td><td>${COLS.plan.get(x)}</td>
            <td class="r">${COLS.amount.get(x)}</td><td>${COLS.status.get(x)}</td><td class="r">${COLS.complete.get(x)}</td></tr>`).join('')}
        </tbody></table></div>` : ''}

      <div class="sectitle">Provenance</div>
      <dl class="fgrid">
        ${f('How it got here', esc(r.source))}
        ${f('Entered by', esc(r.createdBy) + ' <span class="hint">· ' + r.createdAt + '</span>')}
        ${f('Last touched', '<span class="num">' + r.updatedAt + '</span> <span class="hint">· ' + Math.round(daysBetween(D(r.updatedAt), TODAY)) + ' days ago</span>')}
        ${f('Notes', r.notes ? esc(r.notes) : '<span style="color:var(--text-muted)">none</span>')}
      </dl>

      <div class="sectitle">History</div>
      <div class="tl">${r.history.map(h => `<div class="ev ${h.kind === 'changed' ? 'chg' : ''}">
        <time class="num">${h.at}</time> · <span class="hint">${esc(h.who)}</span>
        <div>${h.kind === 'changed'
          ? `${esc(FIELD_LABEL[h.field] || h.field)} — <span class="was">${esc(h.from)}</span> → <b>${esc(h.to)}</b>`
          : esc(h.text)}</div></div>`).join('')}</div>
      <div class="hint" style="margin-top:10px">The history is what makes this a record rather than a reading. It is the only place that remembers the record used to say something else.</div>
    </div>
  </aside>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   10 · SHELL
   ═══════════════════════════════════════════════════════════════════════════ */
const TABS = [
  { k:'explore',  ico:'◳', label:'Explore',    sub:'Group, measure, drill' },
  { k:'records',  ico:'▤', label:'Records',    sub:'The book itself' },
  { k:'quality',  ico:'◆', label:'Data quality',sub:'Gaps and contradictions' },
  { k:'compare',  ico:'⇄', label:'Compare',    sub:'Provider, price, property' },
];
const PINNED = [
  { label:'Where the money goes',       t:'explore', g:'provider',  g2:'planCanon', m:'annual' },
  { label:'One plan, five spellings',   t:'quality', c:'c-spell' },
  { label:'Paying different prices',    t:'quality', c:'c-price' },
  { label:'Nothing to show an auditor', t:'quality', c:'g-inv' },
  { label:'Cost by locality',           t:'explore', g:'loc',       g2:'type',      m:'monthly' },
  { label:'What we added each quarter', t:'explore', g:'type',      g2:'provider',  m:'count', grain:'quarter' },
];

function render() {
  const rows = filtered();
  const badIssues = new Set(CHECKS.filter(c => c.fam === 'con').flatMap(c => c.rows.map(r => r.id))).size;
  const chips = S.filters.map((f,i) => `<span class="chip"><i>${esc(DIMS[f.dim].label)}</i><b>${esc(f.val)}</b><button class="x" data-act="unfilter" data-i="${i}">×</button></span>`).join('')
    + (S.idSet ? `<span class="chip"><i>from a check</i><b>${esc(S.idSetLabel)}</b><button class="x" data-act="clearids">×</button></span>` : '')
    + (S.q ? `<span class="chip"><i>search</i><b>${esc(S.q)}</b><button class="x" data-act="clearq">×</button></span>` : '');

  const body = S.tab === 'explore' ? viewExplore() : S.tab === 'records' ? viewRecords() : S.tab === 'quality' ? viewQuality() : viewCompare();
  const rec = S.open ? RECORDS.find(r => r.id === S.open) : null;

  document.getElementById('root').innerHTML = `<div class="app">
    <div class="brand"><span class="dot"></span><b>Pulse</b><small>· Utilities</small></div>
    <div class="top">
      <div class="search"><span>⌕</span><input id="q" placeholder="PID, property, provider, plan, account number, SSID…" value="${esc(S.q)}"><span class="kbd">${rows.length}</span></div>
      <span style="flex:1"></span>
      <label class="btn" style="cursor:pointer"><input type="checkbox" data-act="superseded" ${S.incSuperseded ? 'checked' : ''} style="margin:0 2px 0 0">Include superseded</label>
      <button class="btn" data-act="theme">${S.theme === 'dark' ? '☾ Dark' : '☀ Light'}</button>
    </div>
    <nav class="rail">
      ${TABS.map(t => `<button class="navitem ${S.tab === t.k ? 'on' : ''}" data-act="tab" data-k="${t.k}">
        <span class="ico">${t.ico}</span><span>${t.label}</span>
        ${t.k === 'quality' ? `<span class="cnt warn">${badIssues}</span>` : t.k === 'records' ? `<span class="cnt">${RECORDS.length}</span>` : ''}</button>`).join('')}
      <div class="grp">Questions worth keeping</div>
      ${PINNED.map((p,i) => `<button class="navitem" data-act="pin" data-i="${i}"><span class="ico" style="color:var(--text-muted)">◦</span><span>${p.label}</span></button>`).join('')}
      <div class="railfoot" style="margin-top:20px;padding:10px;border-radius:9px;background:var(--bg-input)">
        <div class="lbl">The book</div>
        <div style="font-size:12px;color:var(--text-dim);margin-top:5px;line-height:1.55">
          ${RECORDS.length} records · ${PROPS.length} properties<br>${RECORDS.filter(r => r.status === 'superseded').length} of them superseded<br>
          ${RECORDS.filter(r => completeness(r) === CORE.length).length} are complete<br>
          <span style="color:var(--amber)">${badIssues} sit in a contradiction</span>
        </div>
      </div>
    </nav>
    <div class="sub">
      <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
        <h1 style="font-size:15px;letter-spacing:-.01em">${TABS.find(t => t.k === S.tab).label}</h1>
        <span class="hint">${TABS.find(t => t.k === S.tab).sub}</span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        ${chips || '<span class="hint">No filter — every record is in scope. Click anything to narrow it.</span>'}
        ${(S.filters.length || S.idSet || S.q) ? '<button class="btn ghost" data-act="clearall" style="height:25px;font-size:11.5px">clear all</button>' : ''}
      </div>
    </div>
    <main class="main">${body}</main>
  </div>${rec ? viewSheet(rec) : ''}`;
  mountCharts();
}

/* ── events ─────────────────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.getAttribute('data-act');
  if (a === 'tab')        { S.tab = t.dataset.k; }
  else if (a === 'theme') { S.theme = S.theme === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', S.theme); }
  else if (a === 'drill') { addFilter(t.dataset.dim, t.dataset.v); return; }
  else if (a === 'drill2'){ addFilter(t.dataset.pdim, t.dataset.pv); addFilter(t.dataset.dim, t.dataset.v); return; }
  else if (a === 'expand'){ const k = t.dataset.k; S.expand[k] = !S.expand[k]; }
  else if (a === 'unfilter') { S.filters.splice(+t.dataset.i, 1); }
  else if (a === 'clearids') { S.idSet = null; S.idSetLabel = ''; }
  else if (a === 'clearq')   { S.q = ''; }
  else if (a === 'clearall') { S.filters = []; S.idSet = null; S.idSetLabel = ''; S.q = ''; }
  else if (a === 'open')  { S.open = t.dataset.id; reveal = false; }
  else if (a === 'close') { S.open = null; }
  else if (a === 'reveal'){ reveal = !reveal; }
  else if (a === 'check') { S.check = t.dataset.k; }
  else if (a === 'sort')  { const k = t.dataset.k; S.sort = { col:k, dir:S.sort.col === k ? -S.sort.dir : 1 }; }
  else if (a === 'col')   { const k = t.dataset.k; S.cols = S.cols.includes(k) ? S.cols.filter(x => x !== k) : [...DEFAULT_COLS.filter(x => S.cols.includes(x) || x === k), ...S.cols.filter(x => !DEFAULT_COLS.includes(x)), ...(DEFAULT_COLS.includes(k) ? [] : [k])].filter((x,i,arr) => arr.indexOf(x) === i); }
  else if (a === 'superseded') { S.incSuperseded = !S.incSuperseded; }
  else if (a === 'toRecords')  { const c = CHECKS.find(x => x.id === t.dataset.k); S.idSet = new Set(c.rows.map(r => r.id)); S.idSetLabel = c.label; S.tab = 'records'; }
  else if (a === 'pin')   { const p = PINNED[+t.dataset.i]; S.tab = p.t; if (p.g) S.group = p.g; if (p.g2) S.group2 = p.g2; if (p.m) S.measure = p.m; if (p.grain) S.grain = p.grain; if (p.c) S.check = p.c; S.filters = []; S.idSet = null; }
  else if (a === 'csv')   { exportCsv(); return; }
  else if (a === 'set')   { const k = t.dataset.key; if (t.dataset.v != null) S[k] = t.dataset.v; else return; }
  else return;
  render();
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-act="set"]'); if (!t) return;
  S[t.dataset.key] = t.value; if (t.dataset.key === 'group') S.expand = {}; render();
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  S.q = e.target.value;
  const pos = e.target.selectionStart; render();
  const n = document.getElementById('q'); if (n) { n.focus(); n.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.open) { S.open = null; render(); } });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 160); });

function exportCsv() {
  const cols = ['pid','property','locality','type','provider','plan_as_typed','plan_normalised','account','start','amount','cycle','monthly','annual','status','invoice','pays','source','last_paid','updated','missing_fields'];
  const line = r => [r.pid, (PROP[r.pid]||{}).name, (PROP[r.pid]||{}).loc, TYPE[r.type].label, r.provider, r.plan, r.planCanon, r.account, r.start,
    r.amount, r.cycle, Math.round(monthlyOf(r)), Math.round(annualOf(r)), r.status, r.invoice, r.payMode, r.source, r.lastRech, r.updatedAt,
    missingOf(r).map(m => m.label).join('; ')].map(v => `"${String(v == null ? '' : v).replace(/"/g,'""')}"`).join(',');
  const csv = cols.join(',') + '\n' + filtered().map(line).join('\n');
  console.log('[export] ' + filtered().length + ' rows ready — a real build streams this to a file.');
  alertless(csv.split('\n').length - 1);
}
function alertless(n) {
  const el = document.createElement('div');
  el.className = 'card'; el.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:70;padding:10px 15px;box-shadow:var(--shadow);font-size:12.5px';
  el.textContent = `${n} rows exported — in the live build this downloads as CSV.`;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}

document.documentElement.setAttribute('data-theme', S.theme);
initTip(); render();
console.log(`[utilities] ${RECORDS.length} records · ${PROPS.length} properties · ${CHECKS.length} checks`);
CHECKS.forEach(c => console.log(`  ${c.fam === 'con' ? '✖' : '·'} ${c.label}: ${c.rows.length}`));
</script>
